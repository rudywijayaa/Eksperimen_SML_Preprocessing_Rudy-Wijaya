name: Automated Preprocessing Pipeline

on:
  push:
    branches: ['main', 'master']
  pull_request:
    branches: ['main', 'master']

jobs:
  run-preprocessing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyyaml joblib

      - name: Run Preprocessing Automation
        run: |
          python preprocessing/automate_Rudy-Wijaya.py

      - name: Upload Processed Dataset & Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: processed-data-and-artifacts
          path: |
            preprocessing/churn_preprocessing/
            preprocessing/artifacts/
