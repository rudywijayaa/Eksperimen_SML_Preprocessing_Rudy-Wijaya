name: Model Training CI Pipeline

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

env:
  MLFLOW_TRACKING_URI: ${{ github.workspace }}/mlruns

jobs:
  run-ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Run actions/checkout@v3
        uses: actions/checkout@v3

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Check Env
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow dagshub pandas numpy scikit-learn matplotlib seaborn

      - name: Run mlflow project
        run: |
          cd MLProject
          python modelling.py

      - name: Get latest MLflow run_id
        id: get_run_id
        run: |
          RUN_ID=$(python -c "import mlflow; exp = mlflow.get_experiment_by_name('CI_MLProject_Churn'); runs = mlflow.search_runs(experiment_ids=[exp.experiment_id]); print(runs.iloc[0]['run_id'])")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest MLflow Run ID: $RUN_ID"

      - name: Install Python dependencies
        run: |
          pip install docker

      - name: Upload to Google Drive
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-ci-model-artifact
          path: mlruns/

      - name: Build Docker Model
        run: |
          mlflow models build-docker -m "runs:/${{ env.RUN_ID }}/model" -n "churn-prediction-model" --enable-mlserver

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker Image
        run: |
          docker tag churn-prediction-model:latest ${{ secrets.DOCKERHUB_USERNAME }}/churn-prediction-model:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/churn-prediction-model:latest
